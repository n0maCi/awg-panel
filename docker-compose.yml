services:
  awg-panel:
    build:
      context: .
      args:
        AWG_GO_TAG: v3.1.20260813
        AWG_TOOLS_TAG: v3.1.20260812
    image: awg-panel:local
    container_name: awg-panel
    restart: unless-stopped
    environment:
      # Bcrypt-хеш, не открытый пароль. Укажите PASSWORD_HASH в .env.
      PASSWORD_HASH: "${PASSWORD_HASH:?Сначала задайте PASSWORD_HASH в .env}"

      # Допустимые версии: 1.5, 2, 3.1
      AWG_VERSION: "${AWG_VERSION:-3.1}"

      # Публичный IP или домен текущего сервера. Не попадает в бэкап.
      AWG_HOST: "${AWG_HOST:?Задайте публичный IP или домен в AWG_HOST}"
      AWG_PORT: "${AWG_PORT:-51820}"

      # Настройки AWG-интерфейса и клиентских конфигураций.
      AWG_INTERFACE: "${AWG_INTERFACE:-awg0}"
      AWG_ADDRESS: "${AWG_ADDRESS:-10.8.0.1/24}"
      AWG_DEVICE: "${AWG_DEVICE:-eth0}"
      AWG_DNS: "${AWG_DNS:-1.1.1.1,1.0.0.1}"
      AWG_ALLOWED_IPS: "${AWG_ALLOWED_IPS:-0.0.0.0/0,::/0}"
      AWG_MTU: "${AWG_MTU:-1420}"
      AWG_PERSISTENT_KEEPALIVE: "${AWG_PERSISTENT_KEEPALIVE:-25}"

      UI_PORT: "${UI_PORT:-51821}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-12}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"

      # Кластер: standalone, primary или replica. На всех узлах используйте один CLUSTER_SECRET.
      CLUSTER_ROLE: "${CLUSTER_ROLE:-standalone}"
      CLUSTER_NODE_ID: "${CLUSTER_NODE_ID:-}"
      CLUSTER_SECRET: "${CLUSTER_SECRET:-}"
      CLUSTER_PEERS: "${CLUSTER_PEERS:-}"
      CLUSTER_SYNC_INTERVAL_SECONDS: "${CLUSTER_SYNC_INTERVAL_SECONDS:-15}"
      CLUSTER_REQUEST_TIMEOUT_SECONDS: "${CLUSTER_REQUEST_TIMEOUT_SECONDS:-5}"
    volumes:
      - ./data:/data
    ports:
      - "${UI_PORT:-51821}:${UI_PORT:-51821}/tcp"
      - "${AWG_PORT:-51820}:${AWG_PORT:-51820}/udp"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
